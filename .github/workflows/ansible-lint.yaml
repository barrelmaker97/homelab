---
name: Ansible Lint

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ github.token }}
  # mise-action installs only this job's tools; tasks must not install the rest.
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Tool versions come from mise.toml, as on a workstation.
      - uses: jdx/mise-action@v5.1.2
        with:
          version: 2026.10.12
          install_args: "python uv pypi:ansible-lint"
      - name: Lint and syntax check
        run: mise run ansible:check
