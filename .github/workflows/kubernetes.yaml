---
name: Kubernetes Manifests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Flux applies whatever lands on main, so this is the last check before a
# change reaches the cluster. Every directory holding a kustomization.yaml is
# built and validated, custom resources against the datreeio CRD catalog.
# Components are skipped: they build only as part of a kustomization.
# Secrets are skipped: sops-encrypted ones carry a top-level sops block that
# strict validation rejects, and Flux decrypts them before applying.
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5.1.1
        with:
          version: 2026.10.8
          install_args: "kubectl kubeconform"
      - name: Build and validate
        # shell: bash adds pipefail, so a failed build cannot hand kubeconform
        # empty input and pass.
        shell: bash
        run: |
          find kubernetes -name kustomization.yaml -not -path 'kubernetes/components/*' -printf '%h\n' | sort | while read -r dir; do
            echo "== $dir"
            kubectl kustomize "$dir" | kubeconform -strict -summary -skip Secret \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              -
          done

  # Renders every Kustomization and HelmRelease offline, the way Flux will:
  # charts are fetched and templated, post-renderers run, values are checked
  # against chart schemas. Catches what kubeconform cannot see, such as a
  # chart that only fails once rendered. flate is the maintained successor to
  # flux-local.
  render:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5.1.1
        with:
          version: 2026.10.8
          install_args: "github:home-operations/flate"
      - name: Render and test the whole cluster
        run: flate test all --path ./kubernetes

  # Comments the rendered diff against the base branch on the PR: the
  # objects that will actually change in the cluster, not just the lines that
  # changed in Git. Updated in place on each push. A PR that renders no
  # changes, such as a tool or CI update, gets no comment: every new comment
  # is a notification, and an empty one says nothing.
  diff:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5.1.1
        with:
          version: 2026.10.8
          install_args: "github:home-operations/flate"
      - name: Diff rendered output
        env:
          BASE_REF: ${{ github.base_ref }}
        run: flate diff all --path ./kubernetes --base "origin/${BASE_REF}" -o github > diff.txt
      - name: Comment on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          marker="<!-- flate-diff -->"
          id=$(gh api "repos/${REPO}/issues/${PR}/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"${marker}\")) | .id" | head -n 1)
          if [ ! -s diff.txt ] && [ -z "$id" ]; then
            echo "No rendered changes; not commenting."
            exit 0
          fi
          {
            echo "$marker"
            echo "### Rendered cluster changes"
            if [ -s diff.txt ]; then
              echo '```diff'
              head -c 60000 diff.txt
              echo
              echo '```'
              if [ "$(wc -c < diff.txt)" -gt 60000 ]; then echo "_Truncated; run \`flate diff all --path ./kubernetes --base main\` locally for the rest._"; fi
            else
              echo "No rendered changes."
            fi
          } > comment.md
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${id}" -F body=@comment.md > /dev/null
          else
            gh api -X POST "repos/${REPO}/issues/${PR}/comments" -F body=@comment.md > /dev/null
          fi
