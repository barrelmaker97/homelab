# Every tool this repository needs, pinned. Install with `mise install`, then
# `mise run collections` for the Ansible collections. CI installs from this
# same file.

[tools]
# Cluster
kubectl = "1.37.1"            # within one minor of the cluster's Kubernetes
talosctl = "1.14.4"           # matches talos_version in ansible/vars/setup.yaml
flux2 = "2.9.6"               # matches the FluxInstance distribution version
helm = "4.3.1"
"aqua:cloudnative-pg/cloudnative-pg/kubectl-cnpg" = "1.30.1"  # the CNPG operator's version

# Secrets
sops = "3.13.3"
age = "1.3.2"

# Validation, as run in CI
kubeconform = "0.8.0"
"github:home-operations/flate" = "0.6.5"

# Ansible commands and lint share one environment. The collections are pinned
# in ansible/requirements.yml; kubernetes.core needs the kubernetes library.
python = "3.15.1"
uv = "0.13.4"

[tools."pypi:ansible-lint"]
version = "26.10.1"
with = ["ansible-core==2.21.5", "kubernetes"]
expose = ["ansible-core"]

[tasks.collections]
description = "Install the Ansible collections in ansible/requirements.yml"
run = "ansible-galaxy collection install -r ansible/requirements.yml"

[tasks.check]
description = "Run all Ansible and Kubernetes checks used in CI"
depends = ["ansible:check", "kubernetes:validate", "kubernetes:render"]

[tasks."ansible:check"]
description = "Lint and syntax-check Ansible"
depends = ["ansible:lint", "ansible:syntax"]

[tasks."ansible:lint"]
description = "Lint Ansible and repository YAML"
depends = ["collections"]
run = "ansible-lint"

[tasks."ansible:syntax"]
description = "Syntax-check every Ansible playbook"
depends = ["collections"]
dir = "ansible"
shell = "bash -euo pipefail -c"
run = '''
for playbook in *.yaml; do
  if [ "$playbook" = "inventory.yaml" ]; then continue; fi
  echo "== $playbook"
  ansible-playbook --syntax-check "$playbook"
done
'''

[tasks."kubernetes:validate"]
description = "Build every Kubernetes kustomization and validate its schemas"
shell = "bash -euo pipefail -c"
run = '''
find kubernetes -name kustomization.yaml -not -path 'kubernetes/components/*' | sort | while read -r file; do
  dir=${file%/*}
  echo "== $dir"
  kubectl kustomize "$dir" | kubeconform -strict -summary -skip Secret \
    -schema-location default \
    -schema-location '{% raw %}https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json{% endraw %}' \
    -
done
'''

[tasks."kubernetes:render"]
description = "Render and test the whole Flux cluster offline"
run = "flate test all --path ./kubernetes"

[tasks."kubernetes:diff"]
description = "Preview rendered cluster changes against main; accepts flate flags"
quiet = true
output = "interleave"
run = "flate diff all --path ./kubernetes --base main"

# The Image Factory returns the same schematic ID for the same customization,
# so this is the image the nodes run, at talos_version.
[tasks."talos:image"]
description = "Print the Talos installer image for talos_version and the node extensions"
run = '''
set -eu
version=$(sed -n 's/^talos_version: "\(.*\)"$/\1/p' ansible/vars/setup.yaml)
id=$(curl -fsS -X POST --data-binary @ansible/roles/setup/files/customization.yaml \
  https://factory.talos.dev/schematics | sed -n 's/.*"id":"\([0-9a-f]*\)".*/\1/p')
test -n "$version" && test -n "$id"
echo "factory.talos.dev/installer/${id}:v${version}"
'''

# Generates into a private temporary directory, so ~/.talos and the local
# talosconfig are untouched. talosctl prints the diff with every certificate,
# key and token in it, so the output is redacted before it is shown.
[tasks."talos:diff"]
description = "Dry-run setup.yaml's machine configs against the nodes, secrets redacted"
depends = ["collections"]
dir = "ansible"
shell = "bash -euo pipefail -c"
run = '''
tmp=$(mktemp -d)
trap 'rm -rf "$tmp"' EXIT
if ! ansible-playbook setup.yaml --tags configs -e talos_config_dir="$tmp" > "$tmp/setup.log"; then
  cat "$tmp/setup.log"
  exit 1
fi
for config in "$tmp"/*.yaml; do
  node=$(basename "$config" .yaml)
  echo "== $node"
  talosctl -n "$node.lan" apply-config --dry-run --file "$config" 2>&1 | sed -E \
    -e '/-----BEGIN/,/-----END/{/-----(BEGIN|END)/!s/^([-+ ]?[[:space:]]*).*/\1<redacted>/}' \
    -e 's/^([-+ ]?[[:space:]]*[A-Za-z]*([Kk]ey|crt|[Cc]ert|[Ss]ecret|[Tt]oken|[Pp]assword|clusterID|id):)[[:space:]]+[^|>[:space:]].*/\1 <redacted>/' \
    -e 's/^([-+ ]?[[:space:]]*)[A-Za-z0-9+\/=._-]{32,}$/\1<redacted>/' \
    -e 's/(MONITOR [^ ]+ [^ ]+ [^ ]+) [^ ]+/\1 <redacted>/'
done
'''
