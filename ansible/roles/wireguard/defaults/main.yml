---
# The server's address on the VPN, and the subnet clients are given addresses
# from. Clients use the server's address for DNS, which Pi-hole answers since
# its LOCAL listening mode accepts queries from any attached subnet.
wireguard_address: 10.33.167.1/24
wireguard_subnet: 10.33.167.0/24

# UDP port the server listens on, forwarded to it by the router.
wireguard_port: 51820
wireguard_mtu: 1420

# Interface VPN traffic is masqueraded out of to reach the LAN and internet.
wireguard_nat_interface: eth0
