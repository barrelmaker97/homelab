---
argument_specs:
  main:
    short_description: Configure a NUT secondary
    description:
      - Installs nut-client in netclient mode and runs upsmon as a secondary of
        the UPS server, so the host shuts down when the primary sets FSD.
      - Purges nut-server, so a host that used to be the server stops serving
        and keeps no copy of its accounts.
      - The account must exist in the server's upsd.users, so the nut role
        runs on the server first.
    options:
      nut_host:
        description: The UPS to monitor, as ups@server.
        type: str
        required: true
      nut_client_user:
        description: upsd account this host monitors the UPS with.
        type: str
        required: true
      nut_client_password:
        description: Password for nut_client_user.
        type: str
        required: true
