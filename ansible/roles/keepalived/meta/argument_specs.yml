---
argument_specs:
  main:
    short_description: Configure keepalived VRRP failover
    description:
      - Installs keepalived and writes a VRRP configuration that floats a
        virtual IP between the DNS servers, tracking the health checks in
        keepalived_track_scripts.
      - Per-host values come from inventory.yaml.
    options:
      keepalived_state:
        description:
          - Initial VRRP state for this host. Exactly one host should be MASTER.
        type: str
        required: true
        choices: [MASTER, BACKUP]
      keepalived_priority:
        description:
          - VRRP priority. Higher wins the election. Each failing track script
            subtracts 60, so the gap between hosts must be less than that for
            one failure to move the VIP.
        type: int
        required: true
      keepalived_vip:
        description: Virtual IP shared by the DNS servers.
        type: str
        required: true
      keepalived_interface:
        description: Interface the virtual IP is advertised on.
        type: str
        required: true
      keepalived_track_scripts:
        description:
          - Health checks for the services behind the VIP. Each one failing
            subtracts 60 from the priority. The role of the service each
            checks installs the script; this role fails if one is missing,
            rather than letting keepalived skip it.
        type: list
        elements: dict
        required: true
        options:
          name:
            description: vrrp_script name.
            type: str
            required: true
          path:
            description: Executable that exits 0 when the service is healthy.
            type: str
            required: true
      keepalived_router_id:
        description:
          - VRRP virtual router ID. Must match across the hosts in this group
            and not collide with another VRRP group on the same network.
        type: int
        required: true
      keepalived_unicast_src_ip:
        description:
          - Source IP address for unicast VRRP advertisements on this host.
        type: str
        required: true
      keepalived_unicast_peers:
        description:
          - Peer IP addresses that receive unicast VRRP advertisements instead
            of broadcasting multicast on the LAN.
        type: list
        elements: str
        required: true
