---
- name: Install keepalived
  ansible.builtin.apt:
    name: keepalived
    state: present
    update_cache: true
    cache_valid_time: 3600

# keepalived disables a track script it cannot find and keeps running, which
# would quietly leave the VIP unguarded; fail here instead
- name: Check track scripts are installed
  ansible.builtin.stat:
    path: "{{ item.path }}"
  loop: "{{ keepalived_track_scripts }}"
  loop_control:
    label: "{{ item.name }}"
  register: keepalived_track_script_stat

- name: Fail if a track script is missing
  ansible.builtin.assert:
    that: item.stat.exists and item.stat.executable
    fail_msg: >-
      {{ item.item.path }} ({{ item.item.name }}) is missing or not executable.
      Run the playbook of the role that installs it on this host first.
    quiet: true
  loop: "{{ keepalived_track_script_stat.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Configure keepalived
  ansible.builtin.template:
    src: keepalived.conf.j2
    dest: /etc/keepalived/keepalived.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart keepalived

- name: Ensure keepalived is enabled and started
  ansible.builtin.systemd:
    name: keepalived
    enabled: true
    state: started
