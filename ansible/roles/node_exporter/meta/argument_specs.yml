---
argument_specs:
  main:
    short_description: Install the Prometheus node exporter
    description:
      - Installs the official linux-arm64 node exporter release from GitHub,
        verified against its sha256sums.txt, when the installed version
        differs, and runs it as the unprivileged node_exporter user.
    options:
      node_exporter_version:
        description:
          - Release to install. Compared against the installed binary's
            --version output to decide whether to download and reinstall.
        type: str
        required: true
      node_exporter_bind_port:
        description:
          - Port the exporter serves metrics on. Defaults to 9100 via
            defaults/main.yml.
        type: int
