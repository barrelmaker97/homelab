all:
  children:
    dns_servers:
      hosts:
        castor:
          ansible_host: "{{ lan_hosts.castor }}"
          keepalived_state: MASTER
          keepalived_priority: 150
        pollux:
          ansible_host: "{{ lan_hosts.pollux }}"
          keepalived_state: BACKUP
          keepalived_priority: 100
      vars:
        keepalived_vip: "{{ dns_vip }}"
        keepalived_interface: eth0
        keepalived_router_id: 51
        # Installed by the pihole and wireguard roles
        keepalived_track_scripts:
          - name: chk_pihole
            path: /usr/local/bin/check_pihole.sh
          - name: chk_wireguard
            path: /usr/local/bin/check_wireguard.sh
    ups_servers:
      hosts:
        castor:
    ups_clients:
      hosts:
        pollux:
    vpn_servers:
      hosts:
        castor:
        pollux:
