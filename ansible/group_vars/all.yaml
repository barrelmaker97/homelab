---
# Values more than one playbook reads. Values a single playbook needs live in
# its own vars/ file.
ansible_user: barrelmaker

# Every LAN address Ansible uses, by hostname under local_domain. The inventory,
# the VIPs, NUT and NTP all read it, and Pi-hole serves each entry as a DNS
# record. Kubernetes manifests keep their own copies.
lan_hosts:
  openwrt: 192.168.15.1
  soteria: 192.168.15.20
  pollux: 192.168.15.30
  kube.poseidon: 192.168.15.40
  node1-poseidon: 192.168.15.41
  node2-poseidon: 192.168.15.42
  node3-poseidon: 192.168.15.43
  demeter: 192.168.15.50
  poseidon: 192.168.15.64
  castor: 192.168.15.70

# Held by whichever DNS server keepalived elects; it has no name of its own.
dns_vip: 192.168.15.80

# Cluster identity
cluster_host: poseidon
cluster_port: 6443
cluster_vip: "{{ lan_hosts['kube.' ~ cluster_host] }}"
local_domain: lan

# Control plane nodes, one Talos machine config each
node_names:
  - node1-poseidon
  - node2-poseidon
  - node3-poseidon

cluster_domain: "{{ cluster_host }}.{{ local_domain }}"

# NUT: the UPS the ups_servers host serves, and the account the Talos nodes monitor it with.
# nut.yaml configures the server side, setup.yaml the nut-client extension.
nut_server: "{{ lan_hosts[groups['ups_servers'] | first] }}"
nut_ups_name: ups
nut_host: "{{ nut_ups_name }}@{{ nut_server }}"
nut_user: remoteuser
nut_password: >-
  {{ (lookup('community.sops.sops', playbook_dir ~ '/vars/nut.sops.yaml')
      | from_yaml).remoteuser_password }}

# Local NTP server (openwrt), used by the Talos nodes and the DNS hosts.
ntp_server: "{{ lan_hosts.openwrt }}"
