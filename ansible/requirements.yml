---
# Collections the playbooks import, pinned like everything in mise.toml.
# Install with `mise run collections` from the repository root.
collections:
  # k8s, k8s_info, helm, helm_info
  - name: kubernetes.core
    version: "6.6.0"
  # sops lookup
  - name: community.sops
    version: "2.5.0"
  # openssl_privatekey, openssl_csr
  - name: community.crypto
    version: "3.5.1"
