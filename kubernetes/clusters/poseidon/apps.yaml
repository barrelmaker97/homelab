# One Kustomization per app, so a failure is reported by app name and blocks
# nothing else. Settings they all share are set in kustomization.yaml. An
# app depends on:
#   barrelmaker        if it lives in the shared barrelmaker namespace
#   monitoring-prereq  if it creates ServiceMonitors, PodMonitors or
#                      PrometheusRules
#   cloudnative-pg     if it has a PostgreSQL Cluster
#   longhorn-config    if it has volumes
#   gateway            if it has routes
#
# An app with a HelmRelease lists kubernetes/components/helmrelease under
# components in its kustomization.yaml, for the settings every release shares.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: barrelmaker
  namespace: flux-system
spec:
  path: ./kubernetes/apps/barrelmaker
  prune: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dotfiles
  namespace: flux-system
spec:
  path: ./kubernetes/apps/dotfiles
  prune: true
  dependsOn:
    - name: barrelmaker
    - name: gateway
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: jellyfin
  namespace: flux-system
spec:
  path: ./kubernetes/apps/jellyfin
  prune: true
  dependsOn:
    - name: barrelmaker
    - name: longhorn-config
    - name: gateway
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: niucraft
  namespace: flux-system
spec:
  path: ./kubernetes/apps/niucraft
  prune: true
  dependsOn:
    - name: monitoring-prereq
    - name: barrelmaker
    - name: longhorn-config
    - name: gateway
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pistachio
  namespace: flux-system
spec:
  path: ./kubernetes/apps/pistachio
  prune: true
  dependsOn:
    - name: monitoring-prereq
    - name: barrelmaker
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: website
  namespace: flux-system
spec:
  path: ./kubernetes/apps/website
  prune: true
  dependsOn:
    - name: barrelmaker
    - name: gateway
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: loch
  namespace: flux-system
spec:
  path: ./kubernetes/apps/loch
  prune: true
  dependsOn:
    - name: barrelmaker
    - name: longhorn-config
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: valheim
  namespace: flux-system
spec:
  path: ./kubernetes/apps/valheim
  prune: true
  dependsOn:
    - name: monitoring-prereq
    - name: barrelmaker
    - name: longhorn-config
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: obscura
  namespace: flux-system
spec:
  path: ./kubernetes/apps/obscura/prod
  prune: true
  dependsOn:
    - name: monitoring-prereq
    - name: cloudnative-pg
    - name: longhorn-config
    - name: gateway
  postBuild:
    substitute:
      app_namespace: obscura
      availability_severity: critical
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: obscura-dev
  namespace: flux-system
spec:
  path: ./kubernetes/apps/obscura/dev
  prune: true
  dependsOn:
    - name: monitoring-prereq
    - name: cloudnative-pg
    - name: longhorn-config
    - name: gateway
  postBuild:
    substitute:
      app_namespace: obscura-dev
      availability_severity: warning
