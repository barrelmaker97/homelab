# The cluster platform, one Kustomization per layer, ordered by dependsOn
# from the bottom up. Settings they share with the apps are set in
# kustomization.yaml. Unlike the apps they set prune: false: removing a file
# never removes the platform; deleting infrastructure is a deliberate manual
# step.
# A chart and the custom resources it defines are separate Kustomizations
# (metallb and metallb-config): Flux validates a Kustomization as a whole
# before applying it, so the resources cannot ship with the CRDs they need.
# The settings every HelmRelease shares, and the CRD guards, are the
# kubernetes/components/helmrelease component.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-notifications
  namespace: flux-system
spec:
  path: ./kubernetes/infrastructure/flux-notifications
  prune: false

# Layer 0: no dependencies. Everything else renders ServiceMonitors,
# PodMonitors or PrometheusRules into the monitoring CRDs. Envoy Gateway
# defines the Gateway API and its own CRDs, which the gateway layer needs.
# CoreDNS availability customizes the Talos bootstrap deployment without CRDs.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: coredns
  namespace: flux-system
spec:
  path: ./kubernetes/infrastructure/coredns
  prune: false
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-prereq
  namespace: flux-system
spec:
  path: ./kubernetes/infrastructure/monitoring-prereq
  prune: false
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-gateway
  namespace: flux-system
spec:
  path: ./kubernetes/infrastructure/envoy-gateway
  prune: false

# Layer 1: independent of each other; each needs the monitoring CRDs for
# its ServiceMonitors or PodMonitors.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metallb
  namespace: flux-system
spec:
  path: ./kubernetes/infrastructure/metallb
  prune: false
  dependsOn:
    - name: monitoring-prereq
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metallb-config
  namespace: flux-system
spec:
  path: ./kubernetes/infrastructure/metallb-config
  prune: false
  dependsOn:
    - name: metallb
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  path: ./kubernetes/infrastructure/cert-manager
  prune: false
  dependsOn:
    - name: monitoring-prereq
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-config
  namespace: flux-system
spec:
  path: ./kubernetes/infrastructure/cert-manager-config
  prune: false
  dependsOn:
    - name: cert-manager
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudnative-pg
  namespace: flux-system
spec:
  path: ./kubernetes/infrastructure/cloudnative-pg
  prune: false
  dependsOn:
    - name: monitoring-prereq
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn
  namespace: flux-system
spec:
  path: ./kubernetes/infrastructure/longhorn
  prune: false
  dependsOn:
    - name: monitoring-prereq
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn-config
  namespace: flux-system
spec:
  path: ./kubernetes/infrastructure/longhorn-config
  prune: false
  dependsOn:
    - name: longhorn
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metrics-server
  namespace: flux-system
spec:
  path: ./kubernetes/infrastructure/metrics-server
  prune: false
  dependsOn:
    - name: monitoring-prereq

# Layer 2: needs the monitoring CRDs, and Longhorn's storage classes for the
# Prometheus, Alertmanager, Loki and Tempo volumes.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring
  namespace: flux-system
spec:
  path: ./kubernetes/infrastructure/monitoring
  prune: false
  dependsOn:
    - name: monitoring-prereq
    - name: longhorn-config

# Layer 3: the Gateway, once its controller, certificates and load balancer
# address exist, then the routes to the platform UIs, which need the services
# they route to.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway
  namespace: flux-system
spec:
  path: ./kubernetes/infrastructure/gateway
  prune: false
  dependsOn:
    - name: envoy-gateway
    - name: cert-manager-config
    - name: metallb-config
    - name: monitoring-prereq
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: routing
  namespace: flux-system
spec:
  path: ./kubernetes/infrastructure/routing
  prune: false
  dependsOn:
    - name: gateway
    - name: monitoring
    - name: longhorn
