---
# Flux itself. The operator installs and upgrades the Flux controllers to
# match this; bump distribution.version here to upgrade Flux. Ansible's flux
# role applies this same file once, to bootstrap a cluster that has no Flux.
#
# The operator requires this name and namespace. The sync block creates the
# flux-system GitRepository and Kustomization that apply this directory's
# parent, including this file.
apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
  annotations:
    # The flux-system Kustomization prunes, and deleting this object makes
    # the operator uninstall Flux. Removing the file must not do that.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  distribution:
    version: "2.10.0"
    registry: ghcr.io/fluxcd
  sync:
    kind: GitRepository
    url: https://github.com/barrelmaker97/homelab.git
    ref: refs/heads/main
    path: kubernetes/clusters/poseidon
  # Strategic-merge patches, so they apply whether or not a Flux release sets
  # the field: a JSON patch remove fails on a missing key and would block the
  # upgrade.
  kustomize:
    patches:
      - target:
          kind: Namespace
          name: flux-system
        patch: |
          apiVersion: v1
          kind: Namespace
          metadata:
            name: flux-system
            labels:
              pod-security.kubernetes.io/enforce: restricted
              pod-security.kubernetes.io/audit: restricted
              pod-security.kubernetes.io/warn: restricted
      - target:
          kind: Deployment
          name: "(helm|kustomize|source)-controller"
        patch: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: all
          spec:
            template:
              spec:
                containers:
                  - name: manager
                    resources:
                      requests:
                        memory: 192Mi
      # CPU limits throttled the controllers (helm-controller in up to 34% of
      # scheduling periods) while they averaged ~30m.
      - target:
          kind: Deployment
          name: "(helm|kustomize|source|notification)-controller"
        patch: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: all
          spec:
            template:
              spec:
                containers:
                  - name: manager
                    resources:
                      limits:
                        cpu: null
