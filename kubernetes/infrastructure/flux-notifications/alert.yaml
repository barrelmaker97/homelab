---
# Event sources cannot wildcard across namespaces, so this watches the
# flux-system objects. A failing HelmRelease still surfaces here: each app's
# Kustomization sets wait: true, so it fails its health check and reports the
# release by name. flux events -A has the full detail.
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: flux-errors
  namespace: flux-system
spec:
  providerRef:
    name: discord
  eventSeverity: error
  eventSources:
    - kind: GitRepository
      name: "*"
    - kind: HelmRepository
      name: "*"
    - kind: OCIRepository
      name: "*"
    - kind: Kustomization
      name: "*"
  eventMetadata:
    cluster: poseidon
