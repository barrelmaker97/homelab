---
# TLS settings for the internal Gateway. HSTS is omitted here: it would stop
# browsers on devices that do not trust the internal CA from reaching the
# internal UIs at all.
#
# X25519MLKEM768 is a post-quantum hybrid key exchange, preferred where the
# client supports it; the classic curves after it are the fallback.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: poseidon-internal
  namespace: envoy-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: poseidon-internal
      sectionName: https-wildcard
  tls:
    alpnProtocols:
      - h2
      - http/1.1
    ecdhCurves:
      - X25519MLKEM768
      - X25519
      - P-256
  headers:
    lateResponseHeaders:
      set:
        - name: Referrer-Policy
          value: same-origin
        - name: X-Content-Type-Options
          value: nosniff
---
# Re-enable HTTP/2 ALPN on the public Gateway (Envoy Gateway defaults listener
# ALPN to HTTP/1.1 when two HTTPS listeners present certificates with
# overlapping SANs, as `barrelmaker.dev` and `*.barrelmaker.dev` do) and add
# the security headers every public response carries.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: poseidon-public
  namespace: envoy-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: poseidon-public
      sectionName: https-apex
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: poseidon-public
      sectionName: https-wildcard
  tls:
    alpnProtocols:
      - h2
      - http/1.1
    ecdhCurves:
      - X25519MLKEM768
      - X25519
      - P-256
  headers:
    lateResponseHeaders:
      set:
        - name: Strict-Transport-Security
          value: max-age=63072000; includeSubDomains; preload
        - name: Referrer-Policy
          value: same-origin
        - name: X-Content-Type-Options
          value: nosniff
