---
# The ServiceMonitor, PodMonitor and PrometheusRule CRDs that charts across
# the cluster render into. They are a release of their own so that nothing
# else's lifecycle can remove them.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-operator-crds
  namespace: monitoring
spec:
  releaseName: prometheus-operator-crds
  chart:
    spec:
      chart: prometheus-operator-crds
      version: "32.0.2"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 1h
