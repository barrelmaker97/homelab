---
# The monitoring stack, its configuration and its alert rules. The
# AlertmanagerConfig and PrometheusRules need only the CRDs from
# monitoring-prereq, so they can ship alongside the charts.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - secret-grafana-admin-credentials.sops.yaml
  - secret-additional-scrape-configs.yaml
  - kube-prometheus-stack.yaml
  - loki.yaml
  - tempo.yaml
  - otel-collector.yaml
  - secret-discord-webhook-url.sops.yaml
  - alertmanagerconfig.yaml
  - prometheusrule-longhorn-snapshots.yaml
  - prometheusrule-longhorn.yaml
  - prometheusrule-gateway.yaml
  - prometheusrule-certificates.yaml
  - prometheusrule-dewpoint.yaml
  - podmonitor-flux.yaml
  - prometheusrule-flux.yaml
  - prometheusrule-prometheus-storage.yaml
components:
  - ../../components/helmrelease

# The name is not hashed: this layer is never pruned, so hashed names would
# leave every old copy behind for Grafana's sidecar to load.
configMapGenerator:
  - name: dashboards
    namespace: monitoring
    files:
      - dashboards/homelab-nodes.json
      - dashboards/openwrt.json
      - dashboards/dewpoint.json
      - dashboards/envoy-proxy-global.json
      - dashboards/envoy-clusters.json
      - dashboards/envoy-gateway-global.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
