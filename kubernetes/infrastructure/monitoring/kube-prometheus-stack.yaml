---
# crds.enabled: false because the chart bundles its own copy of the
# Prometheus CRDs, at an older operator version than prometheus-operator-crds
# in monitoring-prereq, which owns them. Rendering them here would downgrade
# them on every upgrade.
#
# The Grafana datasource values escape Grafana's own interpolation as $${...}.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  releaseName: kube-prometheus-stack
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "92.14.1"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 1h
  values:
    crds:
      enabled: false
    # The drop rule is the chart default, which setting this list replaces.
    kubeApiServer:
      serviceMonitor:
        metricRelabelings:
          - action: drop
            regex: (etcd_request|apiserver_request_slo|apiserver_request_sli|apiserver_request)_duration_seconds_bucket;(0\.15|0\.2|0\.3|0\.35|0\.4|0\.45|0\.6|0\.7|0\.8|0\.9|1\.25|1\.5|1\.75|2|3|3\.5|4|4\.5|6|7|8|9|15|20|40|45|50)(\.0)?
            sourceLabels:
              - __name__
              - le
          - action: keep
            regex: >-
              aggregator_unavailable_apiservice(_total)?|apiserver_client_certificate_expiration_seconds_(bucket|count)|apiserver_request_sli_duration_seconds_(bucket|count)|apiserver_request_(total|terminations_total)|apiserver_current_inflight_requests|apiserver_resource_objects|apiserver_storage_size_bytes|workqueue_(adds_total|depth|queue_duration_seconds_bucket)|rest_client_(requests_total|request_duration_seconds_bucket)|process_(cpu_seconds_total|resident_memory_bytes|start_time_seconds)|go_goroutines|kubernetes_build_info
            sourceLabels:
              - __name__
    kubelet:
      serviceMonitor:
        cAdvisorInterval: 30s
        # The drop rules are carried over from the chart default, which setting
        # this list replaces.
        cAdvisorMetricRelabelings:
          - action: keep
            regex: >-
              container_cpu_usage_seconds_total|container_cpu_cfs_(throttled_)?periods_total|container_memory_(working_set_bytes|rss|cache|swap)|container_network_(receive|transmit)_(bytes|packets|packets_dropped)_total|container_fs_(reads|writes)(_bytes)?_total
            sourceLabels:
              - __name__
          - action: drop
            regex: container_network_.*;(cali|cilium|cni|lxc|nodelocaldns|tunl).*
            sourceLabels:
              - __name__
              - interface
          - action: drop
            regex: .+;
            sourceLabels:
              - id
              - pod
    kubeEtcd:
      enabled: true
      # Literal node IPs: Kubernetes Endpoints reject hostnames.
      endpoints:
        - "192.168.15.41"
        - "192.168.15.42"
        - "192.168.15.43"
    kubeScheduler:
      service:
        selector:
          k8s-app: kube-scheduler
    kubeControllerManager:
      service:
        selector:
          k8s-app: kube-controller-manager
    prometheusOperator:
      resources:
        requests:
          cpu: 10m
          memory: 96Mi
        limits:
          memory: 192Mi
      prometheusConfigReloader:
        resources:
          requests:
            cpu: 5m
            memory: 64Mi
          limits:
            memory: 128Mi
    kube-state-metrics:
      resources:
        requests:
          cpu: 10m
          memory: 96Mi
        limits:
          memory: 256Mi
    prometheus-node-exporter:
      resources:
        requests:
          cpu: 5m
          memory: 32Mi
        limits:
          memory: 64Mi
    alertmanager:
      alertmanagerSpec:
        alertmanagerConfigMatcherStrategy:
          type: None
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn-protected
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 10Gi
      route:
        main:
          enabled: false
    grafana:
      admin:
        existingSecret: grafana-admin-credentials
      serviceMonitor:
        metricRelabelings:
          - action: drop
            regex: grafana_(apiserver_.*|storage_server_.*|http_response_size_bytes_.*|feature_toggles_info)
            sourceLabels:
              - __name__
      resources:
        requests:
          cpu: 25m
          memory: 768Mi
        limits:
          memory: 1Gi
      sidecar:
        resources:
          requests:
            cpu: 10m
            memory: 96Mi
          limits:
            memory: 128Mi
      additionalDataSources:
        - name: Loki
          type: loki
          uid: loki
          url: http://loki.monitoring.svc.cluster.local:3100
          access: proxy
          isDefault: false
          jsonData:
            derivedFields:
              - name: "trace_id"
                matcherType: "label"
                matcherRegex: "trace_id"
                url: "$${__value.raw}"
                datasourceUid: "tempo"
                urlDisplayLabel: "Trace: $${__value.raw}"
        - name: Tempo
          type: tempo
          uid: tempo
          url: http://tempo.monitoring.svc.cluster.local:3200
          access: proxy
          isDefault: false
          jsonData:
            tracesToLogsV2:
              customQuery: true
              datasourceUid: "loki"
              query: '{$${__tags}} | trace_id = "$${__trace.traceId}"'
              tags:
                - key: "service.name"
                  value: "service_name"
            serviceMap:
              datasourceUid: "prometheus"
            search:
              hide: false
            nodeGraph:
              enabled: true
            lokiSearch:
              datasourceUid: "loki"
      grafana.ini:
        server:
          domain: grafana.barrelmaker.dev
        auth:
          login_cookie_name: __Host-grafana_session
        security:
          cookie_samesite: strict
          cookie_secure: true
          x_content_type_options: false
          content_security_policy: true
          content_security_policy_template: >-
            """
            base-uri 'self';
            connect-src 'self' grafana.com ws://$ROOT_PATH wss://$ROOT_PATH data:;
            default-src 'none';
            font-src 'self';
            form-action 'self';
            frame-ancestors 'self';
            img-src 'self' https://grafana.com data:;
            manifest-src 'self';
            media-src 'none';
            object-src 'none';
            script-src 'unsafe-eval' 'strict-dynamic' $NONCE;
            style-src 'self' 'unsafe-inline' blob:;
            worker-src 'self' blob:;
            """
    prometheus:
      route:
        main:
          enabled: false
      prometheusSpec:
        enableRemoteWriteReceiver: true
        retention: 30d
        resources:
          requests:
            cpu: 250m
            memory: 3584Mi
          limits:
            memory: 6Gi
        ruleSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        additionalScrapeConfigsSecret:
          enabled: true
          name: additional-scrape-configs
          key: prometheus-additional.yaml
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn-monitoring
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 30Gi
