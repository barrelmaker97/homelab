---
# Volume and disk metrics can be reported by more than one longhorn-manager,
# hence the max by (...) on each.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: longhorn
  namespace: monitoring
spec:
  groups:
    - name: longhorn
      rules:
        - alert: LonghornVolumeFaulted
          expr: >-
            max by (pvc_namespace, pvc, volume) (longhorn_volume_robustness{state="faulted"}) == 1
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Longhorn volume for {{ $labels.pvc_namespace }}/{{ $labels.pvc }} is faulted"
            description: >-
              Volume {{ $labels.volume }} has no healthy replica and cannot be
              read or written. Its workload is down until a replica is salvaged
              or the volume is restored from backup.

        - alert: LonghornVolumeDegraded
          expr: >-
            max by (pvc_namespace, pvc, volume) (longhorn_volume_robustness{state="degraded"}) == 1
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Longhorn volume for {{ $labels.pvc_namespace }}/{{ $labels.pvc }} is degraded"
            description: >-
              Volume {{ $labels.volume }} has been running with fewer healthy
              replicas than configured for an hour, longer than a rebuild after
              a node reboot takes. Losing another replica will fault it.

        - alert: LonghornDiskNotReady
          expr: >-
            max by (node, disk) (longhorn_disk_status{condition="ready"}) == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Longhorn disk {{ $labels.disk }} on {{ $labels.node }} is not ready"
            description: >-
              Replicas on this disk are unavailable and no new ones can be
              scheduled there.

        - alert: LonghornDiskUsageHigh
          expr: >-
            max by (node, disk) (longhorn_disk_usage_bytes / longhorn_disk_capacity_bytes) > 0.8
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn disk {{ $labels.disk }} on {{ $labels.node }} is {{ $value | humanizePercentage }} full"
            description: >-
              Longhorn stops scheduling replicas to a disk with less than 10%
              free (storageMinimalAvailablePercentage), after which volume
              creation, expansion and replica rebuilds fail on this node.

        - alert: LonghornVolumeBackupStale
          expr: >-
            time() - max by (pvc_namespace, pvc, volume) (longhorn_volume_last_backup_at) > 36 * 3600
            and max by (pvc_namespace, pvc, volume) (longhorn_volume_last_backup_at) > 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Longhorn volume for {{ $labels.pvc_namespace }}/{{ $labels.pvc }} has no recent backup"
            description: >-
              The last backup of volume {{ $labels.volume }} is
              {{ $value | humanizeDuration }} old, but default-backup runs
              daily. Check the recurring job and the NFS backup target on
              soteria.
