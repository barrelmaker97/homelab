---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: monitoring
spec:
  releaseName: loki
  chart:
    spec:
      chart: loki
      version: "18.17.1"
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: flux-system
      interval: 1h
  values:
    loki:
      analytics:
        reporting_enabled: false
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      # A singleton has no ready memberlist peer to join during a restart.
      extraMemberlistConfig:
        abort_if_cluster_join_fails: false
      storage:
        type: filesystem
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h
      compactor:
        retention_enabled: true
        delete_request_store: filesystem
      limits_config:
        retention_period: 720h  # 30 days
        max_query_lookback: 720h  # 30 days
    deploymentMode: Monolithic
    defaults:
      service:
        publishNotReadyAddresses: false
    singleBinary:
      replicas: 1
      resources:
        requests:
          cpu: 25m
          memory: 192Mi
        limits:
          memory: 512Mi
      persistence:
        enabled: true
        enableStatefulSetAutoDeletePVC: false
        storageClass: longhorn-protected
        size: 10Gi
        whenDeleted: Retain
        whenScaled: Retain
    # Keep the other deployment modes disabled for filesystem storage.
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
    resultsCache:
      enabled: false
    chunksCache:
      enabled: false
    gateway:
      # The new chart enables an exporter sidecar; retain the existing footprint.
      metrics:
        enabled: false
      resources:
        requests:
          cpu: 5m
          memory: 32Mi
        limits:
          memory: 64Mi
    lokiCanary:
      resources:
        requests:
          cpu: 5m
          memory: 48Mi
        limits:
          memory: 96Mi
    sidecar:
      resources:
        requests:
          cpu: 5m
          memory: 128Mi
        limits:
          memory: 192Mi
