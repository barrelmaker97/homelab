---
# Longhorn does not support downgrades. Its uninstall hook refuses to run
# while the deleting-confirmation-flag setting is false, the default.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  releaseName: longhorn
  chart:
    spec:
      chart: longhorn
      version: "1.13.0"
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
      interval: 1h
  values:
    # The chart can set resources only for these two; Longhorn creates its
    # CSI and instance-manager pods itself.
    longhornManager:
      resources:
        requests:
          cpu: 50m
          memory: 384Mi
        limits:
          memory: 1Gi
    longhornGlobalManager:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 128Mi
    persistence:
      defaultClass: false
      defaultDataLocality: best-effort
      defaultClassReplicaCount: 2
    metrics:
      serviceMonitor:
        enabled: true
    defaultSettings:
      allowVolumeCreationWithDegradedAvailability: false
      backupTarget: "nfs://soteria.lan:/volume1/longhorn-backupstore"
      # Upgrade volume engines to the new default after a Longhorn upgrade:
      # live where possible, and offline for strict-local volumes (the CNPG
      # ones), which cannot live-upgrade and so move on their next detach,
      # such as a node reboot.
      concurrentAutomaticEngineUpgradePerNodeLimit: "1"
      concurrentReplicaRebuildPerNodeLimit: "2"
      defaultDataLocality: best-effort
      defaultDataPath: /var/mnt/longhorn
      defaultReplicaCount: "2"
      nodeDrainPolicy: allow-if-replica-is-stopped
      replicaAutoBalance: least-effort
      # Hard cap on snapshots per volume; new snapshots are blocked once reached.
      # The alerts in monitoring/prometheusrule-longhorn-snapshots.yaml fire
      # just below it; keep them in step.
      snapshotMaxCount: "50"
      storageMinimalAvailablePercentage: "10"
    httproute:
      enabled: false
    networkPolicies:
      # Admits the API servers to the admission and conversion webhooks, which
      # are otherwise open to every pod. A node's API server reaches pods on
      # other nodes from its flannel.1 address (.0) and its own from cni0
      # (.1); each /31 is one node's pair. Add a node's pair when it joins.
      kubeAPIServerSourceCIDRs:
        - 10.244.0.0/31
        - 10.244.1.0/31
        - 10.244.2.0/31
