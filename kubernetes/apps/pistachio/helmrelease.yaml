---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pistachio
  namespace: barrelmaker
spec:
  releaseName: pistachio
  chart:
    spec:
      chart: pistachio
      version: "0.4.0"
      sourceRef:
        kind: HelmRepository
        name: barrelmaker
        namespace: flux-system
      interval: 1h
  values:
    pistachio:
      ups:
        host: castor.lan

    replicaCount: 2 # For faster failover

    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1

    topologySpreadConstraints:
      - maxSkew: 1
        minDomains: 2
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: pistachio
            app.kubernetes.io/instance: pistachio
        matchLabelKeys:
          - pod-template-hash

    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        memory: 32Mi

    dashboard:
      enabled: true

    serviceMonitor:
      enabled: true

    prometheusRules:
      enabled: true
