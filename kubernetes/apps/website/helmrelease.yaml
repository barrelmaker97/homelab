---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: website
  namespace: barrelmaker
spec:
  releaseName: website
  chart:
    spec:
      chart: website
      version: "0.9.0"
      sourceRef:
        kind: HelmRepository
        name: barrelmaker
        namespace: flux-system
      interval: 1h
  values:
    gitSync:
      repo: https://github.com/barrelmaker97/website.git
      ref: main
      contentDirectory: website
      periodSeconds: 300
      resources:
        requests:
          cpu: 20m
          memory: 40Mi
        limits:
          memory: 80Mi

    replicaCount: 2 # For faster failover

    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1

    topologySpreadConstraints:
      - maxSkew: 1
        minDomains: 2
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: website
            app.kubernetes.io/instance: website
        matchLabelKeys:
          - pod-template-hash

    httpRoute:
      enabled: true
      parentRefs:
        - name: "poseidon-public"
          namespace: "envoy-gateway-system"
          sectionName: "https-apex"
      hostnames:
        - "barrelmaker.dev"

    resources:
      requests:
        cpu: 20m
        memory: 32Mi
      limits:
        memory: 128Mi
