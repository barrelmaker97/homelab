---
# Obscura keeps its push job queue, message idempotency keys and websocket
# tickets in Valkey as well as using it for pub/sub, so it persists to an AOF
# rather than starting empty after every restart. It is one pod: the server
# connects to a single URL and cannot follow a Sentinel failover.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: valkey
  namespace: obscura
spec:
  releaseName: valkey
  chart:
    spec:
      chart: valkey
      version: "0.12.0"
      sourceRef:
        kind: HelmRepository
        name: valkey
        namespace: flux-system
      interval: 1h
  values:
    auth:
      enabled: true
      usersExistingSecret: obscura-valkey
      aclUsers:
        default:
          permissions: "~* &* +@all"
          passwordKey: password

    # A ReadWriteOnce volume cannot attach to a second pod during a rolling
    # update.
    deploymentStrategy: Recreate

    dataStorage:
      enabled: true
      requestedSize: 1Gi
      className: longhorn-protected
      # Removing the release keeps the volume.
      keepPvc: true

    # noeviction makes writes fail rather than silently dropping queued jobs
    # or idempotency keys. maxmemory leaves room under the limit for the
    # fork that rewrites the AOF.
    valkeyConfig: |
      appendonly yes
      appendfsync everysec
      maxmemory 128mb
      maxmemory-policy noeviction

    # The limit covers maxmemory plus the AOF rewrite fork.
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 256Mi

    metrics:
      enabled: true
      exporter:
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
          limits:
            memory: 64Mi
      serviceMonitor:
        enabled: true
