---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: obscura-postgres
  namespace: obscura
spec:
  groups:
    - name: obscura-postgres.availability
      rules:
        - alert: CloudNativePGInstancesNotReady
          expr: >-
            (
              count(
                up{
                  job="obscura/obscura-postgres"
                } == 1
              )
              or vector(0)
            ) < 3
          for: 2m
          labels:
            severity: critical
            cnpg_cluster: obscura-postgres
            job: obscura/obscura-postgres
            namespace: obscura
          annotations:
            summary: >-
              CloudNativePG cluster {{ $labels.job }}
              has unavailable instances
            description: >-
              Fewer than 3 PostgreSQL
              instances have healthy Prometheus scrape targets.

        - alert: CloudNativePGPostgresDown
          expr: >-
            cnpg_collector_up{
              job="obscura/obscura-postgres"
            } == 0
          for: 1m
          labels:
            severity: critical
            cnpg_cluster: obscura-postgres
            job: obscura/obscura-postgres
            namespace: obscura
          annotations:
            summary: >-
              PostgreSQL is unavailable on {{ $labels.pod }}
            description: >-
              The CloudNativePG collector cannot connect to PostgreSQL on
              {{ $labels.pod }}.

        - alert: CloudNativePGReplicaNotStreaming
          expr: >-
            cnpg_pg_replication_in_recovery{
              job="obscura/obscura-postgres"
            }
            >
            cnpg_pg_replication_is_wal_receiver_up{
              job="obscura/obscura-postgres"
            }
          for: 2m
          labels:
            severity: critical
            cnpg_cluster: obscura-postgres
            job: obscura/obscura-postgres
            namespace: obscura
          annotations:
            summary: >-
              PostgreSQL replica {{ $labels.pod }} is not streaming
            description: >-
              The replica is in recovery but its WAL receiver is not running.

        - alert: CloudNativePGReplicationLagHigh
          expr: >-
            cnpg_pg_replication_lag{
              job="obscura/obscura-postgres"
            } > 300
          for: 2m
          labels:
            severity: warning
            cnpg_cluster: obscura-postgres
            job: obscura/obscura-postgres
            namespace: obscura
          annotations:
            summary: >-
              PostgreSQL replica {{ $labels.pod }} is over five minutes behind
            description: >-
              Replication lag has remained above 300 seconds for two minutes.

        - alert: CloudNativePGSynchronousReplicasUnavailable
          expr: >-
            cnpg_collector_sync_replicas{
              job="obscura/obscura-postgres",
              value="observed"
            }
            < ignoring(value)
            cnpg_collector_sync_replicas{
              job="obscura/obscura-postgres",
              value="expected"
            }
          for: 1m
          labels:
            severity: critical
            cnpg_cluster: obscura-postgres
            job: obscura/obscura-postgres
            namespace: obscura
          annotations:
            summary: >-
              CloudNativePG cluster obscura-postgres lacks synchronous replicas
            description: >-
              Fewer synchronous replicas are available than required; commits
              may block to preserve data durability.

    - name: obscura-postgres.operations
      rules:
        - alert: CloudNativePGLongRunningTransaction
          expr: >-
            cnpg_backends_max_tx_duration_seconds{
              job="obscura/obscura-postgres"
            } > 300
          for: 1m
          labels:
            severity: warning
            cnpg_cluster: obscura-postgres
            job: obscura/obscura-postgres
            namespace: obscura
          annotations:
            summary: >-
              PostgreSQL transaction on {{ $labels.pod }} exceeds five minutes
            description: >-
              A transaction has remained open for more than 300 seconds.

        - alert: CloudNativePGDatabaseXIDAgeHigh
          expr: >-
            max by (namespace, job, datname) (
              cnpg_pg_database_xid_age{
                job="obscura/obscura-postgres"
              }
            ) > 300000000
          for: 5m
          labels:
            severity: warning
            cnpg_cluster: obscura-postgres
            job: obscura/obscura-postgres
            namespace: obscura
          annotations:
            summary: >-
              PostgreSQL database {{ $labels.datname }} has high transaction ID age
            description: >-
              Transaction ID age has exceeded 300 million and requires vacuum
              investigation.

        - alert: CloudNativePGDeadlocksDetected
          expr: >-
            sum by (namespace, job, datname) (
              increase(
                cnpg_pg_stat_database_deadlocks{
                  job="obscura/obscura-postgres",
                  datname!=""
                }[10m]
              )
            ) > 0
          labels:
            severity: warning
            cnpg_cluster: obscura-postgres
            job: obscura/obscura-postgres
            namespace: obscura
          annotations:
            summary: >-
              PostgreSQL deadlocks detected in {{ $labels.datname }}
            description: >-
              One or more deadlocks occurred during the last ten minutes.

        - alert: CloudNativePGMetricsCollectionError
          expr: >-
            cnpg_collector_last_collection_error{
              job="obscura/obscura-postgres"
            } == 1
          for: 2m
          labels:
            severity: warning
            cnpg_cluster: obscura-postgres
            job: obscura/obscura-postgres
            namespace: obscura
          annotations:
            summary: >-
              CloudNativePG metrics collection failed on {{ $labels.pod }}
            description: >-
              The PostgreSQL metrics collector has reported an error for two
              minutes.
