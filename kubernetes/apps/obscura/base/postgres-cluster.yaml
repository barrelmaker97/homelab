---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: obscura-postgres
  namespace: obscura
  annotations:
    # Pruning the Cluster would take its volumes with it.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  description: "Production PostgreSQL cluster for Obscura"
  instances: 3
  # Promote an upgraded replica rather than restarting the primary, which
  # refuses new connections for the full smart shutdown timeout.
  primaryUpdateMethod: switchover
  enablePDB: true
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: obscura
      owner: obscura
      dataChecksums: true
  storage:
    storageClass: longhorn-cnpg-local
    size: 8Gi
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
  postgresql:
    parameters:
      idle_in_transaction_session_timeout: 5min
      track_io_timing: "on"
      track_wal_io_timing: "on"
    pg_hba:
      - "hostnossl all all all reject"
    synchronous:
      method: any
      number: 1
      dataDurability: required
  resources:
    limits:
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 256Mi
