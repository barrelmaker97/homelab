---
# Renovate waits for three-day-old releases; promote after testing in dev.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: obscura
spec:
  chart:
    spec:
      chart: obscura
      version: "0.15.1"
      sourceRef:
        kind: HelmRepository
        name: barrelmaker
        namespace: flux-system
      interval: 1h
  values:
    httpRoute:
      hostnames:
        - "obscura.barrelmaker.dev"
