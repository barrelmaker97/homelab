# Renovate updates this three days after dev; see renovate.json5.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: obscura
spec:
  chart:
    spec:
      chart: obscura
      version: "0.14.3"
      sourceRef:
        kind: HelmRepository
        name: barrelmaker
        namespace: flux-system
      interval: 1h
  values:
    httpRoute:
      hostnames:
        - "obscura.barrelmaker.dev"
