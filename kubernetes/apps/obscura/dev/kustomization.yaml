---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: obscura-dev
resources:
  - ../base
  - secret-rustfs.sops.yaml
  - secret-server.sops.yaml
  - postgres-prometheusrule.yaml
patches:
  - path: helmrelease.yaml
    target:
      kind: HelmRelease
      name: obscura
  - path: postgres-cluster.yaml
    target:
      kind: Cluster
      name: obscura-postgres
