---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: obscura-dev
resources:
  - ../base
  - secret-rustfs.sops.yaml
  - secret-server.sops.yaml
  - secret-obscura-valkey.sops.yaml
patches:
  - path: helmrelease.yaml
    target:
      kind: HelmRelease
      name: obscura
  - path: postgres-cluster.yaml
    target:
      kind: Cluster
      name: obscura-postgres
  # Dev is a staging environment: availability alerts page at warning rather
  # than critical.
  - target:
      kind: PrometheusRule
      name: obscura-postgres
    patch: |
      - op: replace
        path: /spec/groups/0/rules/0/labels/severity
        value: warning
      - op: replace
        path: /spec/groups/0/rules/1/labels/severity
        value: warning
      - op: replace
        path: /spec/groups/0/rules/2/labels/severity
        value: warning
      - op: replace
        path: /spec/groups/0/rules/4/labels/severity
        value: warning
replacements:
  # Rewrite the base PrometheusRules' namespace and job references from
  # obscura to obscura-dev.
  - source:
      kind: Namespace
      name: obscura
      fieldPath: metadata.name
    targets:
      - select:
          kind: PrometheusRule
        fieldPaths:
          - spec.groups.*.rules.*.labels.namespace
      - select:
          kind: PrometheusRule
          name: obscura-postgres
        fieldPaths:
          - spec.groups.*.rules.*.labels.job
        options:
          delimiter: /
          index: 0
      - select:
          kind: PrometheusRule
          name: obscura-valkey
        fieldPaths:
          - spec.groups.*.rules.*.expr
        options:
          delimiter: '"'
          index: 1
      - select:
          kind: PrometheusRule
          name: obscura-valkey
        fieldPaths:
          - spec.groups.1.rules.*.expr
        options:
          delimiter: '"'
          index: 5
  - source:
      kind: PrometheusRule
      name: obscura-postgres
      fieldPath: spec.groups.0.rules.0.labels.job
    targets:
      - select:
          kind: PrometheusRule
          name: obscura-postgres
        fieldPaths:
          - spec.groups.*.rules.*.expr
        options:
          delimiter: '"'
          index: 1
      - select:
          kind: PrometheusRule
          name: obscura-postgres
        fieldPaths:
          - spec.groups.0.rules.2.expr
        options:
          delimiter: '"'
          index: 3
      - select:
          kind: PrometheusRule
          name: obscura-postgres
        fieldPaths:
          - spec.groups.0.rules.4.expr
        options:
          delimiter: '"'
          index: 5
