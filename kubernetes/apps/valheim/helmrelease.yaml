---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: valheim
  namespace: barrelmaker
spec:
  releaseName: valheim
  chart:
    spec:
      chart: valheim
      version: "0.8.0"
      sourceRef:
        kind: HelmRepository
        name: barrelmaker
        namespace: flux-system
      interval: 1h
  values:
    serverName: Barrelmaker
    worldName: Asgard
    public: false
    existingSecret: valheim-password
    metrics: true

    persistence:
      storageClassName: longhorn-protected
      size: 10Gi

    # The files on its volume belong to 111, not the image's steam user (1000).
    podSecurityContext:
      runAsUser: 111

    service:
      type: LoadBalancer
      # The router forwards the game port to this address.
      annotations:
        metallb.io/loadBalancerIPs: 192.168.15.61
      port: 2456

    resources:
      requests:
        cpu: 400m
        memory: 2048Mi
      limits:
        memory: 4000Mi
