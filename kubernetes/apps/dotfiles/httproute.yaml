---
# Redirects https://dotfiles.barrelmaker.dev to the updot script.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dotfiles
  namespace: barrelmaker
spec:
  parentRefs:
    - name: poseidon-public
      namespace: envoy-gateway-system
      sectionName: https-wildcard
  hostnames:
    - dotfiles.barrelmaker.dev
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: raw.githubusercontent.com
            port: 443
            path:
              type: ReplaceFullPath
              replaceFullPath: /barrelmaker97/dotfiles/master/bin/updot
            statusCode: 302
