---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: niucraft
  namespace: barrelmaker
spec:
  releaseName: niucraft
  chart:
    spec:
      chart: minecraft
      version: "0.13.1"
      sourceRef:
        kind: HelmRepository
        name: barrelmaker
        namespace: flux-system
      interval: 1h
  values:
    persistence:
      storageClassName: longhorn-protected
      size: 40Gi

    dynmap:
      enabled: true
      cores: 1
      showOfflinePlayers: true
      showSpawnBeds: true
      config:
        resources:
          requests:
            cpu: 10m
            memory: 10Mi
          limits:
            memory: 30Mi
      httpRoute:
        enabled: true
        parentRefs:
          - name: "poseidon"
            namespace: "envoy-gateway-system"
            sectionName: "https-wildcard"
        hostnames:
          - "niucraft.barrelmaker.dev"

    metrics:
      enabled: true
      dashboard:
        enabled: true
      serviceMonitor:
        enabled: true

    properties:
      aikarFlags: true
      enforceWhitelist: true
      memory: "4G"
      motd: "NIUCraft Server"
      ops: "Barrelmaker97"
      existingWhitelist: "SYNCHRONIZE"
      existingOps: "SYNCHRONIZE"
      paperChannel: "default"
      serverName: "NIUCraft"
      modrinthProjects: >-
        fabric-api,
        fabricexporter,
        spark,
        chunky,
        dynmap,
        minecraft-sqlite-jdbc
      type: "FABRIC"
      version: "1.21.11"
      viewDistance: "16"
      whitelist: >-
        BakerGang2022,
        Barrelmaker97,
        Lil_Doza,
        LuckierDodge,
        Solo22499,
        Spronix,
        ThePrimeus,
        Celery_Trainer,
        ninjahomie7

    service:
      type: LoadBalancer
      # The router forwards the game port to this address.
      annotations:
        metallb.io/loadBalancerIPs: 192.168.15.62
      port: 25565

    resources:
      requests:
        cpu: 500m
        memory: 4608Mi
      limits:
        memory: 5632Mi
