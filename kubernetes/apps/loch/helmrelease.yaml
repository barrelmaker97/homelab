---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loch
  namespace: barrelmaker
spec:
  releaseName: loch
  chart:
    spec:
      chart: factorio
      version: "0.12.2"
      sourceRef:
        kind: HelmRepository
        name: barrelmaker
        namespace: flux-system
      interval: 1h
  values:
    server:
      name: L.O.C.H Factory
      description: Lasciate ogne speranza, voi ch'intrate
      maxPlayers: 5
      public: false
    existingSecret: loch-password
    config:
      resources:
        requests:
          cpu: 20m
          memory: 20Mi
        limits:
          memory: 60Mi
    persistence:
      storageClassName: longhorn-protected
      size: 5Gi
    service:
      type: LoadBalancer
      # The router forwards the game port to this address.
      annotations:
        metallb.io/loadBalancerIPs: 192.168.15.63
      port: 34197
    resources:
      requests:
        cpu: 200m
        memory: 3000Mi
      limits:
        memory: 3584Mi
